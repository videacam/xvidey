<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Stream Connecting Please Wait.....</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;align-items:center;justify-content:center;background:#09090b;color:#fff;font-family:-apple-system,Segoe UI,sans-serif;overflow:hidden}
.bg,.bg:before,.bg:after{position:fixed;inset:0;content:""}
.bg:before{width:40vmax;height:40vmax;border-radius:50%;background:#2563eb;filter:blur(90px);opacity:.22;left:-10vmax;top:-10vmax;animation:f 18s ease-in-out infinite;position:absolute}
.bg:after{width:35vmax;height:35vmax;border-radius:50%;background:#7c3aed;filter:blur(90px);opacity:.18;right:-10vmax;bottom:-10vmax;animation:f 22s ease-in-out infinite reverse;position:absolute}
@keyframes f{50%{transform:translate(40px,-30px) scale(1.15)}}
.card{position:relative;width:360px;max-width:92%;padding:34px;border-radius:28px;background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45);transition:.45s}
.logo{width:82px;height:82px;margin:auto;border-radius:22px;background:linear-gradient(135deg,#2563eb,#60a5fa);display:grid;place-items:center;animation:pulse 2.5s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
svg{width:34px;height:34px;fill:#fff}.spin{width:46px;height:46px;margin:26px auto;border:2px solid rgba(255,255,255,.12);border-top-color:#fff;border-radius:50%;animation:r .9s linear infinite}@keyframes r{to{rotate:360deg}}
h1{margin:0;font-size:28px}p{color:#b7b7bf}.prog{height:4px;background:#222;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#fff,#d1d5db,#fff);background-size:200% 100%;animation:s 2s linear infinite}@keyframes s{to{background-position:-200% 0}}.bottom{display:flex;justify-content:space-between;color:#999;font-size:13px;margin-top:12px}
.fade{opacity:0;transform:scale(.98);filter:blur(8px)}
</style></head><body><div class="bg"></div><div class="card" id="card"><div class="logo"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div><div class="spin"></div><h1>Preparing your stream</h1><p id="status">Connecting...</p><div class="prog"><div class="bar" id="bar"></div></div><div class="bottom"><span id="percent">0%</span><span>Secure Playback</span></div></div>
<script>
const statusEl=document.getElementById('status'),bar=document.getElementById('bar'),percent=document.getElementById('percent'),card=document.getElementById('card');
const url="https://videa.cam/live-sport";
const steps=[["Connecting...",12],["Finding fastest server...",34],["Preparing playback...",58],["Optimizing quality...",82],["Buffering stream...",96],["Ready",100]];
let idx=0;
function advance(){
 if(idx>=steps.length){card.classList.add('fade');setTimeout(()=>window.location.replace(url),450);return;}
 const [t,v]=steps[idx++];
 statusEl.style.opacity=0;
 setTimeout(()=>{statusEl.textContent=t;statusEl.style.opacity=1;bar.style.width=v+"%";percent.textContent=v+"%";setTimeout(advance,[350,500,600,550,450,250][idx-1]);},120);
}
setTimeout(advance,300);
</script></body></html>
